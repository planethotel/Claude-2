<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAIN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%2322d3ee%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%230b0d10%27 stroke=%27white%27 stroke-width=%272.5%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --surface:#14171c; --surface-2:#1a1e25; --elevated:#20252e;
  --text:#e6e8eb; --text-dim:#9aa3ad; --text-faint:#6b747f;
  --border:#252b34; --border-bright:#333b46;
  --accent:#22d3ee; --accent-dim:#0e7490; --accent-glow:rgba(34,211,238,.14);
  --danger:#f87171; --ok:#34d399;
  --radius:12px; --radius-sm:8px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- Barre laterale ---------- */
#sidebar{
  width:260px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .22s ease;
}
#sidebar.hidden{margin-left:-260px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{
  width:30px;height:30px;border-radius:9px;flex-shrink:0;position:relative;
  background:linear-gradient(145deg,#22d3ee,#6366f1);
  display:grid;place-items:center;
}
.mark::after{
  content:"";width:9px;height:9px;border-radius:50%;
  background:var(--bg);box-shadow:0 0 0 2.5px rgba(255,255,255,.9);
}
.brand-name{font-weight:700;font-size:16px;letter-spacing:.16em}
.brand-sub{font-size:10.5px;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase}

.btn-new{
  margin:4px 12px 12px;padding:9px 12px;border:1px solid var(--border-bright);
  border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;
  font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s;
}
.btn-new:hover{background:var(--surface-2);border-color:var(--accent-dim)}

#convs{flex:1;overflow-y:auto;padding:0 8px}
.conv{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  font-size:13.5px;color:var(--text-dim);cursor:pointer;
  white-space:nowrap;overflow:hidden;transition:background .12s;
}
.conv:hover{background:var(--surface-2);color:var(--text)}
.conv.active{background:var(--elevated);color:var(--text)}
.conv-title{flex:1;overflow:hidden;text-overflow:ellipsis}
.conv-del{opacity:0;font-size:16px;line-height:1;color:var(--text-faint);padding:0 2px}
.conv:hover .conv-del{opacity:1}
.conv-del:hover{color:var(--danger)}

.side-foot{padding:12px;border-top:1px solid var(--border)}
label.tiny{display:block;font-size:10.5px;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
select{
  width:100%;padding:7px 9px;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border-bright);border-radius:var(--radius-sm);
  font-size:13px;font-family:var(--font);cursor:pointer;
}
.status{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;color:var(--text-faint)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.dot.off{background:var(--danger)}

/* ---------- Zone principale ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{
  display:flex;align-items:center;gap:12px;padding:11px 18px;
  border-bottom:1px solid var(--border);background:rgba(11,13,16,.85);
  backdrop-filter:blur(8px);
}
.icon-btn{padding:6px;border-radius:6px;color:var(--text-dim);line-height:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
#head-title{font-size:14px;font-weight:500;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.badge{
  font-size:11px;color:var(--accent);background:var(--accent-glow);
  border:1px solid rgba(34,211,238,.28);padding:3px 9px;border-radius:99px;
  font-weight:500;white-space:nowrap;
}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
#thread{max-width:780px;margin:0 auto;padding:28px 24px 8px}

.msg{display:flex;gap:14px;margin-bottom:26px}
.avatar{
  width:29px;height:29px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;
}
.msg.user .avatar{background:var(--elevated);color:var(--text-dim)}
.msg.ai .avatar{background:linear-gradient(145deg,#22d3ee,#6366f1);color:#06202a}
.bubble{flex:1;min-width:0;padding-top:3px}
.who{font-size:11.5px;color:var(--text-faint);margin-bottom:5px;
  letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.content{overflow-wrap:anywhere}
.content p{margin:0 0 11px}
.content p:last-child{margin-bottom:0}
.content ul,.content ol{margin:0 0 11px;padding-left:22px}
.content li{margin-bottom:4px}
.content h1,.content h2,.content h3{margin:18px 0 9px;line-height:1.3;font-weight:600}
.content h1{font-size:20px}.content h2{font-size:17px}.content h3{font-size:15px}
.content a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.content strong{font-weight:600;color:#fff}
.content code:not(pre code){
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;
  padding:1.5px 5px;font-family:var(--mono);font-size:12.8px;color:#a5f3fc;
}
.code-wrap{position:relative;margin:0 0 12px}
.content pre{
  background:#0e1116;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 14px;overflow-x:auto;
}
.content pre code{font-family:var(--mono);font-size:12.8px;line-height:1.6;color:#d6deeb}
.copy{
  position:absolute;top:7px;right:7px;font-size:11px;padding:4px 9px;
  background:var(--elevated);border:1px solid var(--border-bright);
  border-radius:5px;color:var(--text-dim);opacity:0;transition:opacity .15s;
}
.code-wrap:hover .copy{opacity:1}
.copy:hover{color:var(--text);border-color:var(--accent-dim)}

.caret{display:inline-block;width:7px;height:15px;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- Ecran d'accueil ---------- */
#welcome{max-width:780px;margin:0 auto;padding:52px 24px;text-align:center;
  min-height:calc(100vh - 210px);display:flex;flex-direction:column;justify-content:center}
.w-mark{width:56px;height:56px;border-radius:16px;margin:0 auto 20px;
  background:linear-gradient(145deg,#22d3ee,#6366f1);display:grid;place-items:center}
.w-mark::after{content:"";width:17px;height:17px;border-radius:50%;
  background:var(--bg);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
#welcome h1{font-size:26px;font-weight:700;letter-spacing:.14em;margin-bottom:8px}
#welcome p{color:var(--text-dim);font-size:14px;margin-bottom:30px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{
  padding:9px 15px;border:1px solid var(--border-bright);border-radius:99px;
  font-size:13px;color:var(--text-dim);transition:all .15s;
}
.chip:hover{color:var(--text);border-color:var(--accent-dim);background:var(--surface)}

/* ---------- Zone de saisie ---------- */
#composer-wrap{padding:0 24px 18px;background:linear-gradient(transparent,var(--bg) 34%)}
#composer{
  max-width:780px;margin:0 auto;background:var(--surface);
  border:1px solid var(--border-bright);border-radius:var(--radius);
  display:flex;align-items:flex-end;gap:8px;padding:9px 9px 9px 15px;
  transition:border-color .15s,box-shadow .15s;
}
#composer:focus-within{border-color:var(--accent-dim);box-shadow:0 0 0 3px var(--accent-glow)}
#input{
  flex:1;background:none;border:none;resize:none;color:var(--text);
  font-family:var(--font);font-size:14.5px;line-height:1.55;
  max-height:190px;padding:6px 0;outline:none;
}
#input::placeholder{color:var(--text-faint)}
#send{
  width:33px;height:33px;border-radius:8px;background:var(--accent);color:#06202a;
  display:grid;place-items:center;flex-shrink:0;transition:opacity .15s,transform .1s;
}
#send:hover:not(:disabled){transform:scale(1.05)}
#send:disabled{opacity:.3;cursor:not-allowed}
#send.stop{background:var(--danger);color:#2a0606}
.hint{max-width:780px;margin:8px auto 0;font-size:11px;color:var(--text-faint);text-align:center}

#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--elevated);border:1px solid var(--border-bright);
  padding:9px 16px;border-radius:99px;font-size:13px;
  transition:transform .25s;pointer-events:none;z-index:50;
}
#toast.show{transform:translateX(-50%) translateY(0)}

.banner{
  max-width:780px;margin:0 auto 18px;padding:13px 15px;border-radius:var(--radius-sm);
  background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.3);
  color:#fca5a5;font-size:13.5px;
}
.banner code{background:rgba(0,0,0,.35);padding:1.5px 5px;border-radius:4px;
  font-family:var(--mono);font-size:12.5px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#414a57}

@media (max-width:760px){
  #sidebar{position:absolute;height:100%;z-index:20}
  #sidebar.hidden{margin-left:-260px}
  #thread,#composer,#welcome{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  #scroll{scroll-behavior:auto}
}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <div class="brand-name">LAIN</div>
      <div class="brand-sub">IA locale</div>
    </div>
  </div>
  <button class="btn-new" id="btn-new">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nouvelle conversation
  </button>
  <nav id="convs" aria-label="Conversations"></nav>
  <div class="side-foot">
    <label class="tiny" for="model">Modèle</label>
    <select id="model" aria-label="Choix du modèle"></select>
    <div class="status"><span class="dot" id="dot"></span><span id="status-txt">Connexion…</span></div>
  </div>
</aside>

<div id="main">
  <header>
    <button class="icon-btn" id="btn-toggle" aria-label="Afficher ou masquer le panneau">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span id="head-title">Nouvelle conversation</span>
    <span class="badge" id="badge">--</span>
  </header>

  <div id="scroll">
    <div id="welcome">
      <div class="w-mark" aria-hidden="true"></div>
      <h1>LAIN</h1>
      <p>Ton IA, sur ta machine. Rien ne sort d'ici.</p>
      <div class="chips">
        <button class="chip">Explique-moi les closures en JavaScript</button>
        <button class="chip">Écris un script de sauvegarde</button>
        <button class="chip">Corrige ce texte</button>
        <button class="chip">Aide-moi à débugger</button>
      </div>
    </div>
    <div id="thread" hidden></div>
  </div>

  <div id="composer-wrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Écris ton message…" aria-label="Message"></textarea>
      <button id="send" aria-label="Envoyer" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="hint">Entrée pour envoyer &middot; Maj+Entrée pour un retour à la ligne</div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
const API = 'http://127.0.0.1:11434';
const $ = s => document.querySelector(s);
const els = {
  sidebar:$('#sidebar'), convs:$('#convs'), model:$('#model'), dot:$('#dot'),
  status:$('#status-txt'), thread:$('#thread'), welcome:$('#welcome'),
  scroll:$('#scroll'), input:$('#input'), send:$('#send'), badge:$('#badge'),
  title:$('#head-title'), toast:$('#toast')
};

let convos = [], actif = null, enCours = false, ctrl = null;

/* ---------- Stockage local ---------- */
function charger(){
  try{ convos = JSON.parse(localStorage.getItem('lain.convos') || '[]'); }
  catch(e){ convos = []; }
}
function sauver(){
  try{ localStorage.setItem('lain.convos', JSON.stringify(convos.slice(0,60))); }
  catch(e){ /* quota plein : on continue sans persister */ }
}

/* ---------- Rendu Markdown (echappe d'abord, toujours) ---------- */
function esc(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function md(src){
  const blocs = [];
  let t = esc(src);
  // Les blocs de code sont ranges derriere un jeton, puis reinjectes a la fin.
  // Le jeton ne doit pas dependre d'espaces autour : le decoupage en paragraphes
  // fait un trim() qui les supprimerait, et le bloc ne serait jamais restaure.
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m,lang,code){
    blocs.push('<div class="code-wrap"><pre><code>'+code.replace(/\n$/,'')+
               '</code></pre><button class="copy">Copier</button></div>');
    return '\n\n%%BLOC'+(blocs.length-1)+'%%\n\n';
  });
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>')
       .replace(/^## (.+)$/gm,'<h2>$1</h2>')
       .replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(?:^[-*] .+$\n?)+/gm, function(m){
        return '<ul>'+m.trim().split('\n').map(function(l){
          return '<li>'+l.replace(/^[-*] /,'')+'</li>'; }).join('')+'</ul>'; });
  t = t.replace(/(?:^\d+\. .+$\n?)+/gm, function(m){
        return '<ol>'+m.trim().split('\n').map(function(l){
          return '<li>'+l.replace(/^\d+\. /,'')+'</li>'; }).join('')+'</ol>'; });
  t = t.split(/\n{2,}/).map(function(p){
    p = p.trim();
    if(!p) return '';
    if(/^%%BLOC\d+%%$/.test(p)) return p;
    if(/^<(h[123]|ul|ol|div)/.test(p)) return p;
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return t.replace(/%%BLOC(\d+)%%/g, function(m,i){ return blocs[+i]; });
}

/* ---------- Affichage ---------- */
function bulle(role, texte, streaming){
  const d = document.createElement('div');
  d.className = 'msg '+(role==='user'?'user':'ai');
  d.innerHTML = '<div class="avatar">'+(role==='user'?'MOI':'L')+'</div>'+
    '<div class="bubble"><div class="who">'+(role==='user'?'Toi':'LAIN')+'</div>'+
    '<div class="content">'+(streaming?'<span class="caret"></span>':md(texte))+'</div></div>';
  els.thread.appendChild(d);
  return d.querySelector('.content');
}
function afficher(){
  els.thread.innerHTML = '';
  const c = convos.find(function(x){ return x.id===actif; });
  const vide = !c || !c.messages.length;
  els.welcome.hidden = !vide;
  els.thread.hidden = vide;
  els.title.textContent = c ? c.titre : 'Nouvelle conversation';
  if(c) c.messages.forEach(function(m){ bulle(m.role, m.content, false); });
  bas();
}
function listerConvos(){
  els.convs.innerHTML = '';
  convos.forEach(function(c){
    const d = document.createElement('div');
    d.className = 'conv'+(c.id===actif?' active':'');
    d.innerHTML = '<span class="conv-title"></span><button class="conv-del" aria-label="Supprimer">&times;</button>';
    d.querySelector('.conv-title').textContent = c.titre;
    d.onclick = function(e){
      if(e.target.classList.contains('conv-del')){
        convos = convos.filter(function(x){ return x.id!==c.id; });
        if(actif===c.id) actif = convos.length ? convos[0].id : null;
        sauver(); listerConvos(); afficher();
      } else { actif = c.id; listerConvos(); afficher(); }
    };
    els.convs.appendChild(d);
  });
}
function bas(){ els.scroll.scrollTop = els.scroll.scrollHeight; }
function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  setTimeout(function(){ els.toast.classList.remove('show'); }, 1900);
}

/* ---------- Connexion a Ollama ---------- */
async function connecter(){
  try{
    const r = await fetch(API+'/api/tags');
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    const models = data.models || [];
    if(!models.length) throw new Error('aucun modèle');
    els.model.innerHTML = '';
    models.forEach(function(m){
      const o = document.createElement('option');
      o.value = m.name; o.textContent = m.name;
      els.model.appendChild(o);
    });
    const pref = localStorage.getItem('lain.model');
    const monIa = models.filter(function(m){ return m.name.indexOf('mon-ia')===0; })[0];
    if(pref && models.some(function(m){ return m.name===pref; })) els.model.value = pref;
    else if(monIa) els.model.value = monIa.name;
    els.badge.textContent = els.model.value;
    els.dot.className = 'dot on';
    els.status.textContent = 'Connecté · local';
    return true;
  }catch(e){
    els.dot.className = 'dot off';
    els.status.textContent = 'Ollama hors ligne';
    els.badge.textContent = 'hors ligne';
    bandeau();
    return false;
  }
}
function bandeau(){
  if($('#offline-banner')) return;
  const d = document.createElement('div');
  d.id = 'offline-banner'; d.className = 'banner';
  d.innerHTML = 'Impossible de joindre Ollama sur <code>127.0.0.1:11434</code>. '+
                'Ouvre un terminal et lance <code>ollama serve</code>, puis recharge cette page.';
  els.thread.hidden = false;
  els.thread.prepend(d);
}

/* ---------- Envoi ---------- */
async function envoyer(){
  const texte = els.input.value.trim();
  if(!texte || enCours) return;

  if(!actif){
    const c = {id:Date.now(), titre:texte.slice(0,42)+(texte.length>42?'...':''), messages:[]};
    convos.unshift(c); actif = c.id; listerConvos();
    els.title.textContent = c.titre;
  }
  const conv = convos.filter(function(c){ return c.id===actif; })[0];
  conv.messages.push({role:'user', content:texte});

  els.input.value = ''; els.input.style.height = 'auto';
  els.welcome.hidden = true; els.thread.hidden = false;
  bulle('user', texte, false);
  const cible = bulle('assistant', '', true);
  bas();

  enCours = true;
  els.send.classList.add('stop');
  els.send.disabled = false;
  els.send.setAttribute('aria-label','Arrêter la génération');
  ctrl = new AbortController();

  let recu = '';
  try{
    const r = await fetch(API+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:els.model.value, messages:conv.messages, stream:true}),
      signal:ctrl.signal
    });
    if(!r.ok) throw new Error('HTTP '+r.status);

    const lecteur = r.body.getReader();
    const dec = new TextDecoder();
    let tampon = '';
    while(true){
      const res = await lecteur.read();
      if(res.done) break;
      tampon += dec.decode(res.value, {stream:true});
      const lignes = tampon.split('\n');
      tampon = lignes.pop();
      for(const l of lignes){
        if(!l.trim()) continue;
        let o;
        try{ o = JSON.parse(l); }catch(err){ continue; }
        if(o.message && o.message.content){
          recu += o.message.content;
          cible.innerHTML = md(recu)+'<span class="caret"></span>';
          bas();
        }
      }
    }
    cible.innerHTML = md(recu);
    conv.messages.push({role:'assistant', content:recu});
    sauver();
  }catch(e){
    if(e.name === 'AbortError'){
      cible.innerHTML = md(recu || '_(interrompu)_');
      if(recu) conv.messages.push({role:'assistant', content:recu});
      sauver();
    }else{
      cible.innerHTML = '<span style="color:var(--danger)">Erreur : '+esc(e.message)+
        '. Vérifie qu\'Ollama tourne.</span>';
    }
  }finally{
    enCours = false; ctrl = null;
    els.send.classList.remove('stop');
    els.send.setAttribute('aria-label','Envoyer');
    majEnvoi();
    brancherCopie();
  }
}
function brancherCopie(){
  document.querySelectorAll('.copy:not([data-ok])').forEach(function(b){
    b.dataset.ok = 1;
    b.onclick = function(){
      navigator.clipboard.writeText(b.previousElementSibling.textContent)
        .then(function(){ b.textContent='Copié'; toast('Code copié');
                    setTimeout(function(){ b.textContent='Copier'; },1600); })
        .catch(function(){ toast('Copie impossible'); });
    };
  });
}
function majEnvoi(){ els.send.disabled = enCours ? false : !els.input.value.trim(); }

/* ---------- Evenements ---------- */
els.input.addEventListener('input', function(){
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 190)+'px';
  majEnvoi();
});
els.input.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); envoyer(); }
});
els.send.onclick = function(){ if(enCours){ if(ctrl) ctrl.abort(); } else { envoyer(); } };
$('#btn-new').onclick = function(){ actif = null; listerConvos(); afficher(); els.input.focus(); };
$('#btn-toggle').onclick = function(){ els.sidebar.classList.toggle('hidden'); };
els.model.onchange = function(){
  localStorage.setItem('lain.model', els.model.value);
  els.badge.textContent = els.model.value;
};
document.querySelectorAll('.chip').forEach(function(c){
  c.onclick = function(){
    els.input.value = c.textContent;
    els.input.dispatchEvent(new Event('input'));
    envoyer();
  };
});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); $('#btn-new').click(); }
});

charger();
actif = convos.length ? convos[0].id : null;
listerConvos();
afficher();
connecter();
els.input.focus();
</script>
</body>
</html>
