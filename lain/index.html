<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAIN</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04070a; --surface:#0a1014; --surface-2:#101a20; --elevated:#16232b;
  --text:#d8e6e8; --text-dim:#7e929a; --text-faint:#54666e;
  --border:#152229; --border-bright:#20343e;
  --accent:#3ff0d8; --accent-2:#1a8f9e; --accent-glow:rgba(63,240,216,.13);
  --danger:#ff6b7a; --ok:#3ff0d8;
  --radius:12px; --radius-sm:8px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --avatar:none;
  --mx:0px; --my:0px;          /* decalage suivi souris */
  --cx:50%; --cy:50%;          /* position du halo */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- Couches d'ambiance ---------- */
#crt{position:fixed;inset:0;pointer-events:none;z-index:100}
#crt::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  opacity:.5;
}
#crt::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.5) 100%);
}
#scanline{
  position:fixed;left:0;right:0;height:76px;z-index:101;pointer-events:none;
  background:linear-gradient(transparent,rgba(63,240,216,.045),transparent);
  animation:balayage 7.5s linear infinite;
}
@keyframes balayage{from{top:-80px}to{top:100%}}

/* halo qui suit le curseur */
#glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(320px circle at var(--cx) var(--cy),
             rgba(63,240,216,.055),transparent 70%);
  transition:opacity .3s;
}

/* ---------- Mode wired : plus dense, reseau visible ---------- */
#wired{
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:0;
  transition:opacity .5s;
  background-image:
    linear-gradient(rgba(63,240,216,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(63,240,216,.055) 1px,transparent 1px),
    linear-gradient(rgba(63,240,216,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(63,240,216,.028) 1px,transparent 1px);
  background-size:132px 132px,132px 132px,33px 33px,33px 33px;
  background-position:var(--mx) var(--my);
}
body.wired #wired{opacity:1}
/* paquets qui circulent sur le reseau */
#wired::before,#wired::after{
  content:"";position:absolute;height:1px;left:0;right:0;
  background:linear-gradient(90deg,transparent,rgba(63,240,216,.5),transparent);
}
#wired::before{top:26%;animation:paquet 4.5s linear infinite}
#wired::after{top:68%;animation:paquet 6.2s linear infinite reverse}
@keyframes paquet{
  0%{transform:translateX(-60%) scaleX(.28);opacity:0}
  12%{opacity:1}
  88%{opacity:1}
  100%{transform:translateX(60%) scaleX(.28);opacity:0}
}
body.wired #crt::before{
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 1px,transparent 1px 2px);
  opacity:.72;
}
body.wired{--border:#1b3540;--border-bright:#2b5464;--text-dim:#8fb3ba}
body.wired .brand-name{text-shadow:0 0 12px rgba(63,240,216,.55)}
body.wired #welcome h1{text-shadow:0 0 22px rgba(63,240,216,.4)}
body.wired .conv,body.wired .chip,body.wired #head-title{font-family:var(--mono);font-size:12px}

/* ---------- Barre laterale ---------- */
#sidebar{
  width:262px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;transition:margin-left .22s ease;z-index:2;
}
#sidebar.hidden{margin-left:-262px}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}
.brand-name{font-weight:700;font-size:16px;letter-spacing:.22em;font-family:var(--mono)}
.brand-sub{font-size:9.5px;color:var(--text-faint);letter-spacing:.12em;
  text-transform:uppercase;font-family:var(--mono)}

/* ---------- Le portrait ---------- */
.portrait{
  position:relative;border-radius:9px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(150deg,var(--accent-2),#0d2b3a);
  isolation:isolate;
}
.portrait.p-sm{width:32px;height:32px}
.portrait.p-md{width:30px;height:30px;border-radius:8px}
.portrait.p-lg{width:132px;height:132px;border-radius:18px;margin:0 auto 22px}
.portrait .img{
  position:absolute;inset:-6%;background-image:var(--avatar);
  background-size:cover;background-position:center 22%;
  filter:saturate(1.25) contrast(1.12) brightness(.98);
  /* le leger surdimensionnement evite de voir les bords quand elle suit la souris */
  transform:translate(var(--mx),var(--my));
  transition:transform .28s cubic-bezier(.22,.61,.36,1);
}
/* Repli quand aucune image n'est fournie : un oeil geometrique */
.portrait .fallback{
  position:absolute;inset:0;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),#3b4de0);
}
/* L'anneau est dessine en degrade radial et non en box-shadow : le spread
   d'une box-shadow n'accepte pas de pourcentage, l'anneau serait invisible. */
.portrait .fallback::after{
  content:"";width:48%;height:48%;border-radius:50%;
  background:radial-gradient(circle,var(--bg) 0 56%,rgba(255,255,255,.94) 56% 100%);
  transform:translate(var(--mx),var(--my));
  transition:transform .28s cubic-bezier(.22,.61,.36,1);
}
body.has-avatar .portrait .fallback{display:none}
body:not(.has-avatar) .portrait .img{display:none}

/* teinte cyan + grain, esprit ecran cathodique */
.portrait::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 2px),
    linear-gradient(180deg,rgba(63,240,216,.16),rgba(40,90,220,.14));
  mix-blend-mode:screen;opacity:.75;
}

/* Etat "elle parle" : decalage RVB + tremblement */
.portrait.parle .img,.portrait.parle .fallback{animation:tremble 2.6s steps(3) infinite}
.portrait.parle::before{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:var(--avatar);background-size:cover;background-position:center 22%;
  mix-blend-mode:screen;opacity:.4;
  animation:decalageRVB 1.9s steps(2) infinite;
}
body:not(.has-avatar) .portrait.parle::before{display:none}
@keyframes tremble{
  0%,100%{transform:translate(var(--mx),var(--my)) scale(1)}
  33%{transform:translate(calc(var(--mx) + .6px),calc(var(--my) - .4px)) scale(1.008)}
  66%{transform:translate(calc(var(--mx) - .5px),calc(var(--my) + .3px)) scale(.996)}
}
@keyframes decalageRVB{
  0%,100%{transform:translateX(0);filter:none;opacity:.28}
  40%{transform:translateX(-2.2px);filter:hue-rotate(-42deg);opacity:.5}
  70%{transform:translateX(2px);filter:hue-rotate(38deg);opacity:.42}
}
.portrait.parle{box-shadow:0 0 24px -4px var(--accent-glow),0 0 0 1px rgba(63,240,216,.25)}
/* reaction au survol du grand portrait */
.portrait.p-lg{transition:box-shadow .3s,transform .3s}
.portrait.p-lg:hover{box-shadow:0 0 42px -8px rgba(63,240,216,.5);transform:scale(1.025)}

/* barre de "signal" sous le grand portrait */
.signal{display:flex;gap:3px;justify-content:center;height:15px;align-items:flex-end;margin:-10px 0 18px}
.signal i{width:2.5px;background:var(--accent);opacity:.32;height:22%;border-radius:1px;
  transition:height .18s ease,opacity .18s ease}
body.parle .signal i{animation:onde 1s ease-in-out infinite}
.signal i:nth-child(2){animation-delay:.1s}.signal i:nth-child(3){animation-delay:.2s}
.signal i:nth-child(4){animation-delay:.3s}.signal i:nth-child(5){animation-delay:.15s}
.signal i:nth-child(6){animation-delay:.25s}.signal i:nth-child(7){animation-delay:.05s}
@keyframes onde{0%,100%{height:22%;opacity:.35}50%{height:100%;opacity:.9}}

.btn-new{
  margin:4px 12px 12px;padding:9px 12px;border:1px solid var(--border-bright);
  border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:500;transition:background .15s,border-color .15s;
  font-family:var(--mono);letter-spacing:.02em;
}
.btn-new:hover{background:var(--surface-2);border-color:var(--accent-2)}

#convs{flex:1;overflow-y:auto;padding:0 8px;min-height:0}
.conv{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  font-size:13px;color:var(--text-dim);cursor:pointer;
  white-space:nowrap;overflow:hidden;transition:background .12s;
}
.conv:hover{background:var(--surface-2);color:var(--text)}
.conv.active{background:var(--elevated);color:var(--text);
  box-shadow:inset 2px 0 0 var(--accent)}
.conv-title{flex:1;overflow:hidden;text-overflow:ellipsis}
.conv-del{opacity:0;font-size:16px;line-height:1;color:var(--text-faint);padding:0 2px}
.conv:hover .conv-del{opacity:1}
.conv-del:hover{color:var(--danger)}

.side-foot{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
label.tiny{display:block;font-size:9.5px;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;font-family:var(--mono)}
select{
  width:100%;padding:7px 9px;background:var(--surface-2);color:var(--text);
  border:1px solid var(--border-bright);border-radius:var(--radius-sm);
  font-size:12.5px;font-family:var(--mono);cursor:pointer;
}
select+label.tiny{margin-top:11px}
.bascules{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.bascule{
  display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);
  font-family:var(--mono);padding:5px 9px;border:1px solid var(--border-bright);
  border-radius:99px;transition:all .15s;
}
.bascule:hover{color:var(--text);border-color:var(--accent-2)}
.bascule[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-2);
  background:var(--accent-glow)}
.status{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11px;
  color:var(--text-faint);font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pouls 2.6s ease-in-out infinite}
.dot.off{background:var(--danger)}
@keyframes pouls{0%,100%{opacity:1}50%{opacity:.42}}

/* ---------- Zone principale ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{
  display:flex;align-items:center;gap:12px;padding:11px 18px;
  border-bottom:1px solid var(--border);background:rgba(4,7,10,.86);
  backdrop-filter:blur(8px);z-index:3;
}
.icon-btn{padding:6px;border-radius:6px;color:var(--text-dim);line-height:0}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
#head-title{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.badge{
  font-size:10.5px;color:var(--accent);background:var(--accent-glow);
  border:1px solid rgba(63,240,216,.26);padding:3px 9px;border-radius:99px;
  font-weight:500;white-space:nowrap;font-family:var(--mono);
}
.badge.vision{color:#9ae6ff;border-color:rgba(154,230,255,.3);background:rgba(154,230,255,.1)}

#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth;position:relative;z-index:1}
#thread{max-width:780px;margin:0 auto;padding:28px 24px 8px}

.msg{display:flex;gap:14px;margin-bottom:26px;animation:apparait .3s ease both}
@keyframes apparait{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.avatar{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-size:10px;font-weight:700;
  letter-spacing:.06em;font-family:var(--mono);
}
.msg.user .avatar{background:var(--elevated);color:var(--text-dim)}
.bubble{flex:1;min-width:0;padding-top:3px}
.who{font-size:10.5px;color:var(--text-faint);margin-bottom:5px;
  letter-spacing:.14em;text-transform:uppercase;font-weight:600;font-family:var(--mono)}
.msg.ai .who{color:var(--accent-2)}
.content{overflow-wrap:anywhere}
.content p{margin:0 0 11px}
.content p:last-child{margin-bottom:0}
.content ul,.content ol{margin:0 0 11px;padding-left:22px}
.content li{margin-bottom:4px}
.content li::marker{color:var(--accent-2)}
.content h1,.content h2,.content h3{margin:18px 0 9px;line-height:1.3;font-weight:600}
.content h1{font-size:20px}.content h2{font-size:17px}.content h3{font-size:15px}
.content a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.content strong{font-weight:600;color:#fff}
.content code:not(pre code){
  background:var(--surface-2);border:1px solid var(--border);border-radius:5px;
  padding:1.5px 5px;font-family:var(--mono);font-size:12.5px;color:var(--accent);
}
.code-wrap{position:relative;margin:0 0 12px}
.content pre{
  background:#060b0e;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 14px;overflow-x:auto;
}
.content pre code{font-family:var(--mono);font-size:12.5px;line-height:1.65;color:#c6dde0}
.copy{
  position:absolute;top:7px;right:7px;font-size:10.5px;padding:4px 9px;
  background:var(--elevated);border:1px solid var(--border-bright);
  border-radius:5px;color:var(--text-dim);opacity:0;transition:opacity .15s;
  font-family:var(--mono);
}
.code-wrap:hover .copy{opacity:1}
.copy:hover{color:var(--accent);border-color:var(--accent-2)}

/* images jointes dans le fil */
.jointes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.jointes img{
  max-width:190px;max-height:190px;border-radius:var(--radius-sm);
  border:1px solid var(--border-bright);display:block;
  /* une image minuscule resterait invisible sans plancher */
  min-width:56px;min-height:56px;object-fit:contain;background:var(--surface-2);
}

.caret{display:inline-block;width:8px;height:15px;background:var(--accent);
  vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(2) infinite;
  box-shadow:0 0 8px var(--accent)}
@keyframes blink{50%{opacity:0}}

/* ---------- Accueil ---------- */
#welcome{max-width:780px;margin:0 auto;padding:44px 24px;text-align:center;
  min-height:calc(100vh - 210px);display:flex;flex-direction:column;justify-content:center}
#welcome h1{font-size:27px;font-weight:700;letter-spacing:.34em;margin-bottom:9px;
  font-family:var(--mono);text-indent:.34em}
#welcome p{color:var(--text-dim);font-size:13.5px;margin-bottom:9px}
.present{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);
  letter-spacing:.2em;text-transform:uppercase;margin-bottom:30px}
.chips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.chip{
  padding:9px 15px;border:1px solid var(--border-bright);border-radius:99px;
  font-size:12.5px;color:var(--text-dim);transition:all .15s;
}
.chip:hover{color:var(--accent);border-color:var(--accent-2);background:var(--surface);
  box-shadow:0 0 18px -6px var(--accent-glow);transform:translateY(-1px)}

/* texte a effet glitch, uniquement sur le titre */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{
  content:attr(data-txt);position:absolute;left:0;top:0;width:100%;
  clip-path:inset(0 0 0 0);pointer-events:none;
}
.glitch::before{color:#ff4d6d;animation:gl1 4.2s steps(2) infinite;opacity:.5}
.glitch::after{color:var(--accent);animation:gl2 3.4s steps(2) infinite;opacity:.5}
@keyframes gl1{
  0%,92%,100%{transform:none;clip-path:inset(0 0 100% 0)}
  94%{transform:translateX(-2.5px);clip-path:inset(12% 0 62% 0)}
  97%{transform:translateX(2px);clip-path:inset(58% 0 22% 0)}
}
@keyframes gl2{
  0%,90%,100%{transform:none;clip-path:inset(0 0 100% 0)}
  93%{transform:translateX(2.5px);clip-path:inset(38% 0 40% 0)}
  96%{transform:translateX(-2px);clip-path:inset(72% 0 8% 0)}
}

/* ---------- Saisie ---------- */
#composer-wrap{padding:0 24px 18px;background:linear-gradient(transparent,var(--bg) 34%);
  position:relative;z-index:2}
#composer{
  max-width:780px;margin:0 auto;background:var(--surface);
  border:1px solid var(--border-bright);border-radius:var(--radius);
  padding:9px 9px 9px 15px;
  transition:border-color .15s,box-shadow .15s;
}
#composer:focus-within{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-glow)}
.ligne-saisie{display:flex;align-items:flex-end;gap:8px}
#input{
  flex:1;background:none;border:none;resize:none;color:var(--text);
  font-family:var(--font);font-size:14.5px;line-height:1.55;
  max-height:190px;padding:6px 0;outline:none;
}
#input::placeholder{color:var(--text-faint)}
#attach{width:31px;height:31px;border-radius:8px;color:var(--text-dim);
  display:grid;place-items:center;flex-shrink:0;transition:all .15s}
#attach:hover{background:var(--surface-2);color:var(--accent)}
#send{
  width:33px;height:33px;border-radius:8px;background:var(--accent);color:#02181a;
  display:grid;place-items:center;flex-shrink:0;transition:opacity .15s,transform .1s;
}
#send:hover:not(:disabled){transform:scale(1.06)}
#send:disabled{opacity:.28;cursor:not-allowed}
#send.stop{background:var(--danger);color:#2a0606}

/* vignettes des images en attente */
#vignettes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
#vignettes:empty{display:none}
.vignette{position:relative;width:58px;height:58px;border-radius:7px;overflow:hidden;
  border:1px solid var(--border-bright)}
.vignette img{width:100%;height:100%;object-fit:cover;display:block}
.vignette button{
  position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;
  background:rgba(4,7,10,.86);color:#fff;font-size:12px;line-height:1;
  display:grid;place-items:center;
}
.vignette button:hover{background:var(--danger);color:#2a0606}

.hint{max-width:780px;margin:8px auto 0;font-size:10.5px;color:var(--text-faint);
  text-align:center;font-family:var(--mono);letter-spacing:.04em}

/* zone de depot plein ecran */
#drop{
  position:fixed;inset:0;z-index:120;display:none;place-items:center;
  background:rgba(4,7,10,.86);backdrop-filter:blur(4px);
}
#drop.actif{display:grid}
#drop .cadre{
  border:2px dashed var(--accent);border-radius:18px;padding:44px 62px;
  text-align:center;background:rgba(16,26,32,.8);
}
#drop .cadre b{display:block;font-family:var(--mono);font-size:16px;
  letter-spacing:.14em;color:var(--accent);margin-bottom:7px}
#drop .cadre span{font-size:12.5px;color:var(--text-dim)}

#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--elevated);border:1px solid var(--border-bright);
  padding:9px 16px;border-radius:99px;font-size:12.5px;font-family:var(--mono);
  transition:transform .25s;pointer-events:none;z-index:130;max-width:82vw;
}
#toast.show{transform:translateX(-50%) translateY(0)}

.banner{
  max-width:780px;margin:0 auto 18px;padding:13px 15px;border-radius:var(--radius-sm);
  background:rgba(255,107,122,.08);border:1px solid rgba(255,107,122,.28);
  color:#ffa8b2;font-size:13px;
}
.banner code{background:rgba(0,0,0,.4);padding:1.5px 5px;border-radius:4px;
  font-family:var(--mono);font-size:12px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-2)}

@media (max-width:760px){
  /* En surimpression sur petit ecran : il doit donc demarrer ferme,
     sinon il recouvre la zone de saisie. */
  #sidebar{position:absolute;height:100%;z-index:20;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #thread,#composer,#welcome{padding-left:16px;padding-right:16px}
  .portrait.p-lg{width:104px;height:104px}
}

/* Tout ce qui bouge s'arrete si l'utilisateur a demande moins d'animations. */
@media (prefers-reduced-motion:reduce){

  #scanline,#glow{display:none}

</style>

<script>
const API = 'http://127.0.0.1:11434';
const $ = s => document.querySelector(s);
const els = {
  sidebar:$('#sidebar'), convs:$('#convs'), model:$('#model'), dot:$('#dot'),
  status:$('#status-txt'), thread:$('#thread'), welcome:$('#welcome'),
  scroll:$('#scroll'), input:$('#input'), send:$('#send'), badge:$('#badge'),
  badgeVision:$('#badge-vision'), title:$('#head-title'), toast:$('#toast'),
  voice:$('#voice'), voiceToggle:$('#voice-toggle'), voiceLabel:$('#voice-label'),
  wiredToggle:$('#wired-toggle'), soundToggle:$('#sound-toggle'),
  vignettes:$('#vignettes'), fichier:$('#fichier'), drop:$('#drop'), attach:$('#attach')
};

let convos = [], actif = null, enCours = false, ctrl = null;
let images = [];          /* images en attente d'envoi */
let modeleVoitImages = null;
const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= Sons (synthetises, aucun fichier) ================= */
let audioCtx = null, sonsActifs = true;
function ctxAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function bip(freq, duree, type, volume){
  if(!sonsActifs) return;
  const c = ctxAudio(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, c.currentTime);
  g.gain.setValueAtTime(0, c.currentTime);
  g.gain.linearRampToValueAtTime(volume || .05, c.currentTime + .012);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + duree);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + duree + .02);
}
/* Sequence d'allumage : montee, puis deux tonalites, comme un poste qui s'allume. */
function sonDemarrage(){
  if(!sonsActifs) return;
  const c = ctxAudio(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(700, c.currentTime);
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(58, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(320, c.currentTime + .5);
  g.gain.setValueAtTime(.0001, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.05, c.currentTime + .16);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .62);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + .66);
  setTimeout(function(){ bip(880, .1, 'square', .028); }, 480);
  setTimeout(function(){ bip(1320, .16, 'square', .022); }, 610);
}
/* Le navigateur refuse le son avant une interaction : on arme au premier geste. */
let demarrageJoue = false;
function armerSon(){
  if(demarrageJoue) return;
  demarrageJoue = true;
  sonDemarrage();
}
['pointerdown','keydown'].forEach(function(ev){
  document.addEventListener(ev, armerSon, {once:true});
});

/* ================= Portrait ================= */
/* L'image n'est pas livree avec l'appli : on cherche un fichier avatar.*
   depose par l'utilisateur a cote d'index.html. Sinon, oeil geometrique. */
function chargerAvatar(){
  const noms = ['avatar.gif','avatar.png','avatar.webp','avatar.jpg','avatar.jpeg'];
  (function essayer(i){
    if(i >= noms.length) return;
    const img = new Image();
    img.onload = function(){
      document.documentElement.style.setProperty('--avatar','url("'+noms[i]+'")');
      document.body.classList.add('has-avatar');
    };
    img.onerror = function(){ essayer(i+1); };
    img.src = noms[i];
  })(0);
}
function parle(actifBool){
  document.querySelectorAll('.portrait').forEach(function(p){
    p.classList.toggle('parle', actifBool);
  });
  document.body.classList.toggle('parle', actifBool);
}

/* ================= Suivi de la souris ================= */
/* Le portrait derive legerement vers le curseur, et un halo le suit. */
let cibleX = 0, cibleY = 0, courantX = 0, courantY = 0, animSouris = null;
function boucleSouris(){
  courantX += (cibleX - courantX) * .12;
  courantY += (cibleY - courantY) * .12;
  const r = document.documentElement.style;
  r.setProperty('--mx', courantX.toFixed(2)+'px');
  r.setProperty('--my', courantY.toFixed(2)+'px');
  if(Math.abs(cibleX-courantX) > .05 || Math.abs(cibleY-courantY) > .05){
    animSouris = requestAnimationFrame(boucleSouris);
  } else { animSouris = null; }
}
if(!reduit){
  document.addEventListener('pointermove', function(e){
    cibleX = (e.clientX / window.innerWidth  - .5) * 7;
    cibleY = (e.clientY / window.innerHeight - .5) * 7;
    document.documentElement.style.setProperty('--cx', e.clientX+'px');
    document.documentElement.style.setProperty('--cy', e.clientY+'px');
    if(!animSouris) animSouris = requestAnimationFrame(boucleSouris);
  });
}

/* ================= Voix ================= */
const synth = window.speechSynthesis || null;
let voixDispo = [], voixActive = false;

/* Voix feminines francaises, de la plus naturelle a la plus basique.
   Les "Natural" de Windows 11 sont nettement au-dessus des anciennes. */
const PREFEREES = ['denise','vivienne','eloise','charline','julie','hortense',
                   'audrey','amelie','caroline','marie','lea','sylvie'];

function estFeminine(v){
  const n = v.name.toLowerCase();
  if(/(paul|claude|thierry|henri|nicolas|male|homme)/.test(n)) return false;
  return PREFEREES.some(function(x){ return n.indexOf(x) >= 0; }) ||
         /female|f[ée]minin/.test(n);
}
function chargerVoix(){
  if(!synth) return;
  const toutes = synth.getVoices() || [];
  voixDispo = toutes.filter(function(v){ return /^fr/i.test(v.lang); });
  if(!voixDispo.length) voixDispo = toutes;

  voixDispo.sort(function(a,b){
    const ia = PREFEREES.findIndex(function(x){ return a.name.toLowerCase().indexOf(x)>=0; });
    const ib = PREFEREES.findIndex(function(x){ return b.name.toLowerCase().indexOf(x)>=0; });
    return (ia<0?99:ia) - (ib<0?99:ib);
  });

  els.voice.innerHTML = '';
  if(!voixDispo.length){
    const o = document.createElement('option');
    o.textContent = 'aucune voix systeme'; o.value = '';
    els.voice.appendChild(o);
    els.voice.disabled = true;
    return;
  }
  els.voice.disabled = false;
  voixDispo.forEach(function(v){
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name.replace(/^Microsoft /,'') + (estFeminine(v) ? '' : ' (h)');
    els.voice.appendChild(o);
  });
  const pref = localStorage.getItem('lain.voix');
  const feminine = voixDispo.filter(estFeminine)[0];
  if(pref && voixDispo.some(function(v){ return v.name===pref; })) els.voice.value = pref;
  else if(feminine) els.voice.value = feminine.name;
}
function voixChoisie(){
  return voixDispo.filter(function(v){ return v.name === els.voice.value; })[0] || voixDispo[0];
}
function dire(texte){
  if(!voixActive || !synth || !texte.trim()) return;
  const u = new SpeechSynthesisUtterance(texte);
  const v = voixChoisie();
  if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'fr-FR'; }
  /* Reglages choisis : debit legerement pose, hauteur remontee pour une voix
     jeune et douce plutot que neutre. */
  u.rate = 0.98; u.pitch = 1.28;
  u.onstart = function(){ parle(true); };
  u.onend = function(){ if(!synth.speaking) parle(false); };
  u.onerror = function(){ parle(false); };
  synth.speak(u);
}
function stopVoix(){ if(synth) synth.cancel(); parle(false); }

/* Le texte arrive par petits morceaux : on ne parle qu'une fois la phrase
   complete, sinon la synthese hache la lecture. */
function creerDiseur(){
  let tampon = '';
  return {
    ajouter:function(bout){
      tampon += bout;
      let m;
      while((m = tampon.match(/^[\s\S]*?[.!?…:]["»)]?\s/))){
        dire(m[0]); tampon = tampon.slice(m[0].length);
      }
      if(tampon.length > 320){ dire(tampon); tampon = ''; }
    },
    vider:function(){ if(tampon.trim()) dire(tampon); tampon = ''; }
  };
}

/* ================= Images ================= */
/* Reduites avant envoi : les modeles de vision n'exploitent pas plus de
   ~1120px, et une image brute ferait exploser le quota de stockage. */
function reduireImage(fichier){
  return new Promise(function(resoudre, rejeter){
    const lect = new FileReader();
    lect.onerror = function(){ rejeter(new Error('lecture impossible')); };
    lect.onload = function(e){
      const img = new Image();
      img.onerror = function(){ rejeter(new Error('image illisible')); };
      img.onload = function(){
        const max = 1024;
        let {width:w, height:h} = img;
        if(w > max || h > max){
          const k = Math.min(max/w, max/h);
          w = Math.round(w*k); h = Math.round(h*k);
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resoudre(cv.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    lect.readAsDataURL(fichier);
  });
}
async function ajouterImages(liste){
  const fichiers = Array.from(liste || []).filter(function(f){
    return f && /^image\//.test(f.type);
  });
  if(!fichiers.length) return;
  for(const f of fichiers){
    if(images.length >= 6){ toast('6 images maximum'); break; }
    try{
      const dataUrl = await reduireImage(f);
      images.push({id:String(Date.now())+Math.random(), dataUrl:dataUrl,
                   b64:dataUrl.split(',')[1]});
    }catch(e){ toast('Image ignorée : '+e.message); }
  }
  rendreVignettes();
  majEnvoi();
  bip(1180, .05, 'square', .02);
  if(modeleVoitImages === false) toast('Ce modèle ne lit pas les images');
}
function rendreVignettes(){
  els.vignettes.innerHTML = '';
  images.forEach(function(im){
    const d = document.createElement('div');
    d.className = 'vignette';
    const i = document.createElement('img');
    i.src = im.dataUrl; i.alt = 'image jointe';
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = '×';
    b.setAttribute('aria-label','Retirer cette image');
    b.onclick = function(){
      images = images.filter(function(x){ return x.id !== im.id; });
      rendreVignettes(); majEnvoi();
    };
    d.appendChild(i); d.appendChild(b);
    els.vignettes.appendChild(d);
  });
}

/* ================= Stockage ================= */
function charger(){
  try{ convos = JSON.parse(localStorage.getItem('lain.convos') || '[]'); }
  catch(e){ convos = []; }
}
/* Les images pesent lourd : si le quota deborde, on retente en n'en gardant
   que les plus recentes, puis aucune, plutot que de tout perdre. */
function sauver(){
  const essais = [
    function(c){ return c; },
    function(c){ return c.map(function(cv, i){
        return i === 0 ? cv : Object.assign({}, cv, {messages: sansImages(cv.messages)}); }); },
    function(c){ return c.map(function(cv){
        return Object.assign({}, cv, {messages: sansImages(cv.messages)}); }); }
  ];
  for(const transformer of essais){
    try{
      localStorage.setItem('lain.convos',
        JSON.stringify(transformer(convos).slice(0,60)));
      return true;
    }catch(e){ /* quota : on tente la variante suivante */ }
  }
  return false;
}
function sansImages(msgs){
  return msgs.map(function(m){
    if(!m.images) return m;
    const c = Object.assign({}, m); delete c.images; delete c.apercus; return c;
  });
}

/* ================= Markdown ================= */
function esc(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function md(src){
  const blocs = [];
  let t = esc(src);
  // Les blocs de code sont ranges derriere un jeton, puis reinjectes a la fin.
  // Le jeton ne doit pas dependre d'espaces autour : le decoupage en paragraphes
  // fait un trim() qui les supprimerait, et le bloc ne serait jamais restaure.
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m,lang,code){
    blocs.push('<div class="code-wrap"><pre><code>'+code.replace(/\n$/,'')+
               '</code></pre><button class="copy">Copier</button></div>');
    return '\n\n%%BLOC'+(blocs.length-1)+'%%\n\n';
  });
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>')
       .replace(/^## (.+)$/gm,'<h2>$1</h2>')
       .replace(/^# (.+)$/gm,'<h1>$1</h1>');
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/(?:^[-*] .+$\n?)+/gm, function(m){
        return '<ul>'+m.trim().split('\n').map(function(l){
          return '<li>'+l.replace(/^[-*] /,'')+'</li>'; }).join('')+'</ul>'; });
  t = t.replace(/(?:^\d+\. .+$\n?)+/gm, function(m){
        return '<ol>'+m.trim().split('\n').map(function(l){
          return '<li>'+l.replace(/^\d+\. /,'')+'</li>'; }).join('')+'</ol>'; });
  t = t.split(/\n{2,}/).map(function(p){
    p = p.trim();
    if(!p) return '';
    if(/^%%BLOC\d+%%$/.test(p)) return p;
    if(/^<(h[123]|ul|ol|div)/.test(p)) return p;
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  return t.replace(/%%BLOC(\d+)%%/g, function(m,i){ return blocs[+i]; });
}

/* ================= Affichage ================= */
function bulle(role, texte, streaming, apercus){
  const d = document.createElement('div');
  d.className = 'msg '+(role==='user'?'user':'ai');
  const av = role==='user'
    ? '<div class="avatar">MOI</div>'
    : '<div class="portrait p-md" aria-hidden="true"><div class="fallback"></div><div class="img"></div></div>';
  d.innerHTML = av+'<div class="bubble"><div class="who">'+(role==='user'?'Toi':'LAIN')+'</div>'+
    '<div class="jointes"></div>'+
    '<div class="content">'+(streaming?'<span class="caret"></span>':md(texte))+'</div></div>';
  const zone = d.querySelector('.jointes');
  if(apercus && apercus.length){
    apercus.forEach(function(src){
      const i = document.createElement('img');
      i.src = src; i.alt = 'image envoyée';
      zone.appendChild(i);
    });
  } else { zone.remove(); }
  els.thread.appendChild(d);
  return d.querySelector('.content');
}
function afficher(){
  els.thread.innerHTML = '';
  const c = convos.filter(function(x){ return x.id===actif; })[0];
  const vide = !c || !c.messages.length;
  els.welcome.hidden = !vide;
  els.thread.hidden = vide;
  els.title.textContent = c ? c.titre : 'Nouvelle conversation';
  if(c) c.messages.forEach(function(m){ bulle(m.role, m.content, false, m.apercus); });
  brancherCopie();
  bas();
}
function listerConvos(){
  els.convs.innerHTML = '';
  convos.forEach(function(c){
    const d = document.createElement('div');
    d.className = 'conv'+(c.id===actif?' active':'');
    d.innerHTML = '<span class="conv-title"></span><button class="conv-del" aria-label="Supprimer">&times;</button>';
    d.querySelector('.conv-title').textContent = c.titre;
    d.onclick = function(e){
      if(e.target.classList.contains('conv-del')){
        convos = convos.filter(function(x){ return x.id!==c.id; });
        if(actif===c.id) actif = convos.length ? convos[0].id : null;
        sauver(); listerConvos(); afficher();
      } else {
        actif = c.id; listerConvos(); afficher(); bip(760,.04,'sine',.018);
        if(window.innerWidth <= 760) els.sidebar.classList.add('hidden');
      }
    };
    els.convs.appendChild(d);
  });
}
function bas(){ els.scroll.scrollTop = els.scroll.scrollHeight; }
function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  setTimeout(function(){ els.toast.classList.remove('show'); }, 2400);
}

/* ================= Ollama ================= */
async function connecter(){
  try{
    const r = await fetch(API+'/api/tags');
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    const models = data.models || [];
    if(!models.length) throw new Error('aucun modèle');
    els.model.innerHTML = '';
    models.forEach(function(m){
      const o = document.createElement('option');
      o.value = m.name; o.textContent = m.name;
      els.model.appendChild(o);
    });
    const pref = localStorage.getItem('lain.model');
    const monIa = models.filter(function(m){ return m.name.indexOf('mon-ia')===0; })[0];
    if(pref && models.some(function(m){ return m.name===pref; })) els.model.value = pref;
    else if(monIa) els.model.value = monIa.name;
    els.badge.textContent = els.model.value;
    els.dot.className = 'dot on';
    els.status.textContent = 'Connecté · local';
    majVision();
    return true;
  }catch(e){
    els.dot.className = 'dot off';
    els.status.textContent = 'Ollama hors ligne';
    els.badge.textContent = 'hors ligne';
    bandeau();
    return false;
  }
}
/* Tous les modeles ne lisent pas les images. On demande a Ollama ce que
   celui-ci sait faire, pour prevenir avant l'envoi plutot qu'apres. */
async function majVision(){
  modeleVoitImages = null;
  els.badgeVision.hidden = true;
  const nom = els.model.value;
  if(!nom) return;
  try{
    const r = await fetch(API+'/api/show',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:nom})
    });
    if(!r.ok) return;
    const d = await r.json();
    let vision = false;
    if(Array.isArray(d.capabilities)){
      vision = d.capabilities.indexOf('vision') >= 0;
    }else{
      const fam = (d.details && d.details.families) || [];
      vision = fam.some(function(f){ return /clip|mllama|vision/i.test(f); });
    }
    modeleVoitImages = vision;
    els.badgeVision.hidden = !vision;
  }catch(e){ /* version d'Ollama sans /api/show : on n'affirme rien */ }
}
function bandeau(){
  if($('#offline-banner')) return;
  const d = document.createElement('div');
  d.id = 'offline-banner'; d.className = 'banner';
  d.innerHTML = 'Impossible de joindre Ollama sur <code>127.0.0.1:11434</code>. '+
                'Ouvre un terminal et lance <code>ollama serve</code>, puis recharge cette page.';
  els.thread.hidden = false;
  els.thread.prepend(d);
}

/* ================= Envoi ================= */
async function envoyer(){
  const texte = els.input.value.trim();
  if((!texte && !images.length) || enCours) return;
  stopVoix();

  const jointes = images.slice();
  images = []; rendreVignettes();

  const titre = texte || (jointes.length+' image'+(jointes.length>1?'s':''));
  if(!actif){
    const c = {id:Date.now(), titre:titre.slice(0,42)+(titre.length>42?'...':''), messages:[]};
    convos.unshift(c); actif = c.id; listerConvos();
    els.title.textContent = c.titre;
  }
  const conv = convos.filter(function(c){ return c.id===actif; })[0];

  const msg = {role:'user', content:texte};
  if(jointes.length){
    msg.images  = jointes.map(function(i){ return i.b64; });      /* pour Ollama */
    msg.apercus = jointes.map(function(i){ return i.dataUrl; });  /* pour l'affichage */
  }
  conv.messages.push(msg);

  els.input.value = ''; els.input.style.height = 'auto';
  els.welcome.hidden = true; els.thread.hidden = false;
  bulle('user', texte, false, msg.apercus);
  const cible = bulle('assistant', '', true);
  bas();
  bip(660, .05, 'sine', .022);

  if(jointes.length && modeleVoitImages === false){
    toast('« '+els.model.value+' » ne lit pas les images. Essaie : ollama pull llava:7b');
  }

  enCours = true;
  els.send.classList.add('stop');
  els.send.disabled = false;
  els.send.setAttribute('aria-label','Arrêter la génération');
  ctrl = new AbortController();
  const diseur = creerDiseur();

  /* On n'envoie pas les apercus a Ollama : il n'attend que le champ images. */
  const pourOllama = conv.messages.map(function(m){
    const c = {role:m.role, content:m.content};
    if(m.images) c.images = m.images;
    return c;
  });

  let recu = '';
  try{
    const r = await fetch(API+'/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:els.model.value, messages:pourOllama, stream:true}),
      signal:ctrl.signal
    });
    if(!r.ok) throw new Error('HTTP '+r.status);

    const lecteur = r.body.getReader();
    const dec = new TextDecoder();
    let tampon = '';
    while(true){
      const res = await lecteur.read();
      if(res.done) break;
      tampon += dec.decode(res.value, {stream:true});
      const lignes = tampon.split('\n');
      tampon = lignes.pop();
      for(const l of lignes){
        if(!l.trim()) continue;
        let o;
        try{ o = JSON.parse(l); }catch(err){ continue; }
        if(o.message && o.message.content){
          recu += o.message.content;
          diseur.ajouter(o.message.content);
          cible.innerHTML = md(recu)+'<span class="caret"></span>';
          bas();
        }
      }
    }
    diseur.vider();
    cible.innerHTML = md(recu);
    conv.messages.push({role:'assistant', content:recu});
    sauver();
    bip(980, .07, 'sine', .02);
  }catch(e){
    if(e.name === 'AbortError'){
      stopVoix();
      cible.innerHTML = md(recu || '_(interrompu)_');
      if(recu) conv.messages.push({role:'assistant', content:recu});
      sauver();
    }else{
      cible.innerHTML = '<span style="color:var(--danger)">Erreur : '+esc(e.message)+
        '. Vérifie qu\'Ollama tourne.</span>';
    }
  }finally{
    enCours = false; ctrl = null;
    els.send.classList.remove('stop');
    els.send.setAttribute('aria-label','Envoyer');
    majEnvoi();
    brancherCopie();
  }
}
function brancherCopie(){
  document.querySelectorAll('.copy:not([data-ok])').forEach(function(b){
    b.dataset.ok = 1;
    b.onclick = function(){
      navigator.clipboard.writeText(b.previousElementSibling.textContent)
        .then(function(){ b.textContent='Copié'; toast('Code copié');
                    setTimeout(function(){ b.textContent='Copier'; },1600); })
        .catch(function(){ toast('Copie impossible'); });
    };
  });
}
function majEnvoi(){
  els.send.disabled = enCours ? false : !(els.input.value.trim() || images.length);
}

/* ================= Evenements ================= */
els.input.addEventListener('input', function(){
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 190)+'px';
  majEnvoi();
});
els.input.addEventListener('keydown', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); envoyer(); }
});
els.send.onclick = function(){ if(enCours){ if(ctrl) ctrl.abort(); } else { envoyer(); } };
els.attach.onclick = function(){ els.fichier.click(); };
els.fichier.onchange = function(){ ajouterImages(els.fichier.files); els.fichier.value = ''; };

/* coller une image depuis le presse-papiers */
document.addEventListener('paste', function(e){
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const fichiers = [];
  for(const it of items){
    if(it.kind === 'file'){ const f = it.getAsFile(); if(f) fichiers.push(f); }
  }
  if(fichiers.length){ e.preventDefault(); ajouterImages(fichiers); }
});

/* glisser-deposer sur toute la fenetre */
let compteurDrag = 0;
window.addEventListener('dragenter', function(e){
  if(!e.dataTransfer || Array.from(e.dataTransfer.types).indexOf('Files') < 0) return;
  e.preventDefault(); compteurDrag++; els.drop.classList.add('actif');
});
window.addEventListener('dragover', function(e){
  if(e.dataTransfer && Array.from(e.dataTransfer.types).indexOf('Files') >= 0) e.preventDefault();
});
window.addEventListener('dragleave', function(){
  compteurDrag = Math.max(0, compteurDrag-1);
  if(!compteurDrag) els.drop.classList.remove('actif');
});
window.addEventListener('drop', function(e){
  if(!e.dataTransfer) return;
  e.preventDefault(); compteurDrag = 0; els.drop.classList.remove('actif');
  ajouterImages(e.dataTransfer.files);
});

$('#btn-new').onclick = function(){
  stopVoix(); actif = null; images = []; rendreVignettes();
  listerConvos(); afficher(); majEnvoi(); els.input.focus();
};
$('#btn-toggle').onclick = function(){ els.sidebar.classList.toggle('hidden'); };

/* Le panneau est en surimpression sous 760px : on le ferme d'office a cette
   taille, et on le rouvre en repassant au large, sans ecraser un choix
   explicite fait dans la meme tranche de largeur. */
let etroitAvant = null;
function ajusterPanneau(){
  const etroit = window.innerWidth <= 760;
  if(etroit === etroitAvant) return;
  etroitAvant = etroit;
  els.sidebar.classList.toggle('hidden', etroit);
}
window.addEventListener('resize', ajusterPanneau);
ajusterPanneau();
els.model.onchange = function(){
  localStorage.setItem('lain.model', els.model.value);
  els.badge.textContent = els.model.value;
  majVision();
};
els.voice.onchange = function(){ localStorage.setItem('lain.voix', els.voice.value); };
els.voiceToggle.onclick = function(){
  voixActive = !voixActive;
  els.voiceToggle.setAttribute('aria-pressed', String(voixActive));
  els.voiceLabel.textContent = voixActive ? 'Voix ON' : 'Voix';
  localStorage.setItem('lain.voixActive', voixActive ? '1' : '0');
  if(!voixActive) stopVoix();
  else if(!voixDispo.length) toast('Aucune voix française installée sur Windows');
  bip(voixActive ? 940 : 480, .06, 'square', .022);
};
els.wiredToggle.onclick = function(){
  const on = !document.body.classList.contains('wired');
  document.body.classList.toggle('wired', on);
  els.wiredToggle.setAttribute('aria-pressed', String(on));
  localStorage.setItem('lain.wired', on ? '1' : '0');
  bip(on ? 1240 : 620, .09, 'square', .024);
};
els.soundToggle.onclick = function(){
  sonsActifs = !sonsActifs;
  els.soundToggle.setAttribute('aria-pressed', String(sonsActifs));
  localStorage.setItem('lain.sons', sonsActifs ? '1' : '0');
  if(sonsActifs) bip(880, .07, 'sine', .025);
};
document.querySelectorAll('.chip').forEach(function(c){
  c.onclick = function(){
    els.input.value = c.textContent;
    els.input.dispatchEvent(new Event('input'));
    envoyer();
  };
});
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key==='k'){ e.preventDefault(); $('#btn-new').click(); }
  if(e.key==='Escape'){
    if(synth && synth.speaking) stopVoix();
    els.drop.classList.remove('actif'); compteurDrag = 0;
  }
});

/* ================= Demarrage ================= */
chargerAvatar();
if(localStorage.getItem('lain.wired') === '1'){
  document.body.classList.add('wired');
  els.wiredToggle.setAttribute('aria-pressed','true');
}
if(localStorage.getItem('lain.sons') === '0'){
  sonsActifs = false;
  els.soundToggle.setAttribute('aria-pressed','false');
}
if(synth){
  chargerVoix();
  synth.onvoiceschanged = chargerVoix;   // Chrome les charge en differe
  /* La voix est active par defaut : elle ne demarre qu'apres un envoi,
     donc apres un geste de l'utilisateur -- le navigateur l'autorise. */
  voixActive = localStorage.getItem('lain.voixActive') !== '0';
  els.voiceToggle.setAttribute('aria-pressed', String(voixActive));
  els.voiceLabel.textContent = voixActive ? 'Voix ON' : 'Voix';
}else{
  els.voice.disabled = true;
  els.voiceToggle.disabled = true;
  els.voiceLabel.textContent = 'Voix indispo';
}
charger();
actif = convos.length ? convos[0].id : null;
listerConvos();
afficher();
connecter();
els.input.focus();
</script>
</body>
