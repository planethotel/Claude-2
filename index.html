<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Est-ce que je te plais ?</title>
<meta name="description" content="Un petit questionnaire ludique en 9 questions.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF3EC;
    --surface:#FFFFFF;
    --surface-2:#FFE7EE;
    --ink:#2B1B2E;
    --muted:#8A7387;
    --accent:#FF4D6D;
    --accent-ink:#FFFFFF;
    --accent-soft:#FFD9E1;
    --accent-2:#6C4AB6;
    --accent-2-soft:#E7DEFA;
    --line:#F1D9DE;
    --shadow: 0 20px 40px -24px rgba(107,32,60,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1220;
      --surface:#271A2E;
      --surface-2:#33223C;
      --ink:#F6EAF1;
      --muted:#C0A7BA;
      --accent:#FF6B87;
      --accent-ink:#1B1220;
      --accent-soft:#4A2A3A;
      --accent-2:#B49CF0;
      --accent-2-soft:#3B2E52;
      --line:#3D2A42;
      --shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1220;
    --surface:#271A2E;
    --surface-2:#33223C;
    --ink:#F6EAF1;
    --muted:#C0A7BA;
    --accent:#FF6B87;
    --accent-ink:#1B1220;
    --accent-soft:#4A2A3A;
    --accent-2:#B49CF0;
    --accent-2-soft:#3B2E52;
    --line:#3D2A42;
    --shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(60% 50% at 15% -5%, var(--accent-soft) 0%, transparent 60%),
      radial-gradient(50% 45% at 100% 0%, var(--accent-2-soft) 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding-inline:16px;
    padding-block:32px;
  }
  h1,h2,h3,.display{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  .wrap{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    color:var(--accent);
  }
  .brand svg{width:22px;height:22px;flex:none;}
  .brand span{
    font-family:"Fraunces",serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .progress{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .progress-track{
    flex:1;
    height:8px;
    border-radius:99px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .5s cubic-bezier(.65,0,.35,1);
  }
  .progress-label{
    font-size:12px;
    font-weight:800;
    color:var(--muted);
    white-space:nowrap;
    font-variant-numeric: tabular-nums;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:26px;
    padding:30px 26px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(120% 60% at 0% 0%, var(--accent-soft) 0%, transparent 45%);
    opacity:.6;
    pointer-events:none;
  }
  .card > *{position:relative;}
  .eyebrow{
    font-size:12px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 8px;
  }
  .question{
    font-size:26px;
    line-height:1.2;
    margin:0 0 18px;
  }
  .sub{
    color:var(--muted);
    font-size:14.5px;
    font-weight:600;
    margin:-10px 0 18px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover{border-color:var(--accent);background:var(--accent-soft);}
  .opt:active{transform:scale(.98);}
  .opt.big{
    justify-content:center;
    font-size:16px;
    padding:16px;
  }
  .opt .tick{
    flex:none;
    width:20px;height:20px;
    border-radius:6px;
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, background .15s;
  }
  .opt.checked{border-color:var(--accent);background:var(--accent-soft);}
  .opt.checked .tick{background:var(--accent);border-color:var(--accent);}
  .opt .tick svg{width:12px;height:12px;opacity:0;transition:opacity .1s;}
  .opt.checked .tick svg{opacity:1;}

  .btn{
    appearance:none;
    border:none;
    border-radius:16px;
    padding:15px 20px;
    font-family:inherit;
    font-weight:800;
    font-size:15.5px;
    cursor:pointer;
    width:100%;
    transition:transform .1s, opacity .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    color:#fff;
    box-shadow:0 12px 24px -10px rgba(255,77,109,.55);
  }
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1.5px solid var(--line);
  }
  .row-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:22px;
  }

  .reply-box{
    background:var(--accent-2-soft);
    border-radius:18px;
    padding:18px 18px;
    font-size:16px;
    font-weight:700;
    line-height:1.45;
    color:var(--ink);
    margin-bottom:20px;
  }

  .scale-value{
    font-family:"Fraunces",serif;
    font-size:56px;
    font-weight:700;
    text-align:center;
    color:var(--accent);
    line-height:1;
    margin:6px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .scale-value span{font-size:22px;color:var(--muted);font-weight:700;}
  input[type=range]{
    width:100%;
    margin:18px 0 6px;
    accent-color:var(--accent);
    height:6px;
  }
  .scale-labels{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    font-weight:700;
  }

  textarea{
    width:100%;
    min-height:120px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-family:inherit;
    font-size:15px;
    padding:14px;
    resize:vertical;
  }
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .center-emoji{font-size:44px;text-align:center;margin-bottom:6px;}

  .recap{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:18px 0 6px;
  }
  .recap-item{
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .recap-q{
    font-size:11.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--accent-2);
    margin-bottom:4px;
  }
  .recap-a{font-size:14.5px;font-weight:700;}

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,0);
    background:var(--ink);
    color:var(--bg);
    padding:10px 18px;
    border-radius:99px;
    font-size:13.5px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:10;
  }
  .toast.show{opacity:1;transform:translate(-50%,-6px);}

  @keyframes fadeSlide{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .fade-in{animation:fadeSlide .35s cubic-bezier(.2,.8,.2,1) both;}

  @media (prefers-reduced-motion: reduce){
    .fade-in{animation:none;}
    .progress-fill{transition:none;}
  }

  a.btn-primary{display:block;text-align:center;text-decoration:none;box-sizing:border-box;}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10.2-9.2C.1 8.7 1.4 5 5 4.1c2.1-.5 4.1.4 5.3 2.1L12 8.1l1.7-1.9c1.2-1.7 3.2-2.6 5.3-2.1C22.6 5 23.9 8.7 22.2 11.8 19.5 16.4 12 21 12 21z"/></svg>
    <span>un petit questionnaire</span>
  </div>
  <div class="progress" id="progressRow">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0/9</div>
  </div>
  <div id="stage"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var TOTAL_Q = 9;

  var relationReplies = {
    unsure: "Un proverbe chinois dit : si la montagne bloque la route, fonce et croise les doigts 💀",
    sexfriend: "😂😂 sérieux, audacieux… mais j'aime l'audace, donc viens en fait",
    friend: "Je fonce vers la friend zone, je t'appelle de là-bas 🏎",
    serious: "Je vois que madame a du goût. Je ne peux pas te promettre de tout te donner, mais seulement d'essayer",
    perfect: "🤣🤣 t'es dans quel monde… mais bon, parfait, c'est comme ça qu'on m'appelle",
    busride: "Bon choix : avec moi tu vas te retrouver dans des situations improbables, et découvrir quelqu'un de profondément étrange… mais attachant, à tester",
    soulmate: "Pas mal, du goût pour les bonnes choses. Je pense être capable de te soutenir et de te faire avancer sans t'étouffer. Si c'est ce que tu veux, je sais pas où on ira, mais on ira loin"
  };

  var relationOptions = [
    {id:"unsure", label:"Je sais pas, t'es relou et tu me mets mal à l'aise"},
    {id:"sexfriend", label:"Sex friend"},
    {id:"friend", label:"Amie uniquement"},
    {id:"serious", label:"Relation sérieuse"},
    {id:"perfect", label:"Relation parfaite"},
    {id:"busride", label:"Fou du bus"},
    {id:"soulmate", label:"Être ton âme sœur et entreprendre ensemble"}
  ];

  var likeOptions = [
    "Soirée chill",
    "Airbnb ambiance Netflix",
    "Grosse teuf puis dodo à l'Airbnb",
    "Faire de la moto derrière moi",
    "Petit ciné",
    "Rien, casse-toi t'es chelou",
    "Karting",
    "Petite balade avec discussion de merde"
  ];

  var state = {
    plait: null,
    relation: null,
    likes: [],
    noteprestation: 5,
    noteboite: 5,
    noteattirance: 5,
    notesortir: 5,
    hommeideal: "",
    aime: null
  };

  var stage = document.getElementById("stage");
  var progressRow = document.getElementById("progressRow");
  var progressFill = document.getElementById("progressFill");
  var progressLabel = document.getElementById("progressLabel");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200);
  }

  function setProgress(n){
    if(n == null){
      progressRow.style.display = "none";
      return;
    }
    progressRow.style.display = "flex";
    progressFill.style.width = Math.round((n/TOTAL_Q)*100) + "%";
    progressLabel.textContent = n + "/" + TOTAL_Q;
  }

  function render(html, progress){
    stage.innerHTML = '<div class="card fade-in">' + html + '</div>';
    setProgress(progress);
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  }

  // ---------- screens ----------

  function screenWelcome(){
    render(
      '<div class="center-emoji">💌</div>' +
      '<h1 class="question" style="text-align:center">Un petit questionnaire… rien que pour toi</h1>' +
      '<p class="sub" style="text-align:center;margin-top:-6px">9 questions, 2 minutes, plein de sincérité (et un peu de second degré 😅)</p>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="start">On commence 💝</button>' +
      '</div>',
      null
    );
    document.getElementById("start").onclick = function(){ screenQ1(); };
  }

  function screenQ1(){
    render(
      '<p class="eyebrow">Question 1 / 9</p>' +
      '<h2 class="question">Est-ce que je te plais ?</h2>' +
      '<div class="options">' +
        '<button class="opt big" data-v="oui">Oui</button>' +
        '<button class="opt big" data-v="non">Non</button>' +
      '</div>',
      1
    );
    stage.querySelectorAll(".opt").forEach(function(btn){
      btn.onclick = function(){
        state.plait = btn.dataset.v;
        if(btn.dataset.v === "non"){ screenEndNon(); }
        else { screenQ2(); }
      };
    });
  }

  function screenEndNon(){
    render(
      '<div class="center-emoji">🤤</div>' +
      '<h2 class="question" style="text-align:center">Pas grave</h2>' +
      '<p class="reply-box" style="text-align:center">J\'ai un KFC pour oublier 🍗😅</p>' +
      '<div class="row-actions">' +
        '<button class="btn btn-ghost" id="restart">Recommencer</button>' +
      '</div>',
      null
    );
    document.getElementById("restart").onclick = restartAll;
  }

  function screenQ2(){
    var html = '<p class="eyebrow">Question 2 / 9</p>' +
      '<h2 class="question">Qu\'est-ce que tu veux comme type de relation ?</h2>' +
      '<div class="options">';
    relationOptions.forEach(function(o){
      html += '<button class="opt" data-v="'+o.id+'">'+esc(o.label)+'</button>';
    });
    html += '</div>';
    render(html, 2);
    stage.querySelectorAll(".opt").forEach(function(btn){
      btn.onclick = function(){
        state.relation = btn.dataset.v;
        screenQ2Reply();
      };
    });
  }

  function relationLabel(id){
    var found = relationOptions.filter(function(o){ return o.id === id; })[0];
    return found ? found.label : "";
  }

  function screenQ2Reply(){
    render(
      '<p class="eyebrow">Ta réponse : ' + esc(relationLabel(state.relation)) + '</p>' +
      '<div class="reply-box">' + esc(relationReplies[state.relation]) + '</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="next">Suite →</button>' +
      '</div>',
      2
    );
    document.getElementById("next").onclick = screenQ3;
  }

  function screenQ3(){
    var html = '<p class="eyebrow">Question 3 / 9</p>' +
      '<h2 class="question">Qu\'est-ce que tu aimes ?</h2>' +
      '<p class="sub">Coche tout ce que tu veux</p>' +
      '<div class="options">';
    likeOptions.forEach(function(label, i){
      var checked = state.likes.indexOf(label) > -1;
      html += '<button class="opt'+(checked?' checked':'')+'" data-i="'+i+'">' +
        '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
        esc(label) + '</button>';
    });
    html += '</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="next">Valider</button>' +
      '</div>';
    render(html, 3);

    stage.querySelectorAll(".opt").forEach(function(btn){
      btn.onclick = function(){
        var label = likeOptions[btn.dataset.i];
        var idx = state.likes.indexOf(label);
        if(idx > -1){ state.likes.splice(idx,1); btn.classList.remove("checked"); }
        else { state.likes.push(label); btn.classList.add("checked"); }
      };
    });
    document.getElementById("next").onclick = screenQ3Reply;
  }

  function screenQ3Reply(){
    var listText = state.likes.length
      ? state.likes.map(function(l){ return "• " + esc(l); }).join("<br>")
      : "• rien du tout (mystérieuse 😏)";
    render(
      '<div class="reply-box">Cool ça, moi j\'aime aussi :<br><br>' + listText + '<br><br>Quelle coïncidence 😅</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="next">Suite →</button>' +
      '</div>',
      3
    );
    document.getElementById("next").onclick = screenQ4;
  }

  function screenScale(opts){
    // opts: {step, title, sub, key, next}
    render(
      '<p class="eyebrow">Question ' + opts.step + ' / 9</p>' +
      '<h2 class="question">' + opts.title + '</h2>' +
      (opts.sub ? '<p class="sub">' + opts.sub + '</p>' : '') +
      '<div class="scale-value" id="scaleVal">' + state[opts.key] + '<span>/10</span></div>' +
      '<input type="range" id="scaleInput" min="0" max="10" step="1" value="' + state[opts.key] + '">' +
      '<div class="scale-labels"><span>0</span><span>10</span></div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="next">Suite →</button>' +
      '</div>',
      opts.step
    );
    var input = document.getElementById("scaleInput");
    var val = document.getElementById("scaleVal");
    input.oninput = function(){
      state[opts.key] = Number(input.value);
      val.innerHTML = input.value + "<span>/10</span>";
    };
    document.getElementById("next").onclick = opts.next;
  }

  function screenQ4(){
    screenScale({step:4, title:"Sur 10, tu notes ma prestation ?", key:"noteprestation", next:screenQ5});
  }
  function screenQ5(){
    screenScale({step:5, title:"Sur 10, tu notes la soirée en boîte qu\'on a passée ensemble ?", key:"noteboite", next:screenQ6});
  }
  function screenQ6(){
    screenScale({step:6, title:"Sur 10, tu me notes en attirance ?", key:"noteattirance", next:screenQ7});
  }
  function screenQ7(){
    screenScale({step:7, title:"Sur 10, tu notes la possibilité qu\'on sorte ensemble ?", key:"notesortir", next:screenQ8});
  }

  function screenQ8(){
    render(
      '<p class="eyebrow">Question 8 / 9</p>' +
      '<h2 class="question">Waouh 😮 Et comment serait l\'homme idéal pour toi ?</h2>' +
      '<textarea id="idealInput" placeholder="Écris tout ce que tu veux…">' + esc(state.hommeideal) + '</textarea>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="next">Suite →</button>' +
      '</div>',
      8
    );
    document.getElementById("next").onclick = function(){
      state.hommeideal = document.getElementById("idealInput").value.trim();
      screenQ8Reply();
    };
  }

  function screenQ8Reply(){
    render(
      '<div class="reply-box">Je t\'ai dit l\'homme parfait, pas moi 😉</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary" id="next">Suite →</button>' +
      '</div>',
      8
    );
    document.getElementById("next").onclick = screenQ9;
  }

  function screenQ9(){
    render(
      '<p class="eyebrow">Question 9 / 9</p>' +
      '<h2 class="question">T\'as aimé ce questionnaire ?</h2>' +
      '<div class="options">' +
        '<button class="opt big" data-v="oui">Oui</button>' +
        '<button class="opt big" data-v="non">Non</button>' +
      '</div>',
      9
    );
    stage.querySelectorAll(".opt").forEach(function(btn){
      btn.onclick = function(){
        state.aime = btn.dataset.v;
        screenFinal();
      };
    });
  }

  function buildRecap(plain){
    var rows = [
      ["Est-ce que je te plais ?", state.plait === "oui" ? "Oui" : "Non"],
      ["Type de relation voulu", relationLabel(state.relation)],
      ["Ce qu'elle aime", state.likes.length ? state.likes.join(", ") : "(rien coché)"],
      ["Note de sa prestation /10", state.noteprestation],
      ["Note de la soirée en boîte /10", state.noteboite],
      ["Note d'attirance /10", state.noteattirance],
      ["Note de chance de sortir ensemble /10", state.notesortir],
      ["Homme idéal", state.hommeideal || "(pas de réponse)"],
      ["A aimé le questionnaire ?", state.aime === "oui" ? "Oui" : "Non"]
    ];
    if(plain){
      return rows.map(function(r){ return r[0] + " : " + r[1]; }).join("\n");
    }
    return rows.map(function(r){
      return '<div class="recap-item"><div class="recap-q">' + esc(r[0]) + '</div><div class="recap-a">' + esc(String(r[1])) + '</div></div>';
    }).join("");
  }

  function screenFinal(){
    var subject = encodeURIComponent("Mes réponses au questionnaire 💌");
